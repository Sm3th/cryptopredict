version: "3.9"

services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - "8000:8000"
    volumes:
      - model_data:/app/models
    environment:
      - MODEL_PATH=/app/models/crypto_lstm_model.keras
      - SCALER_PATH=/app/models/scaler.pkl
      - ALLOWED_ORIGINS=http://localhost:5173,http://localhost:80
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "80:80"
    depends_on:
      - backend
    restart: unless-stopped

volumes:
  model_data:
